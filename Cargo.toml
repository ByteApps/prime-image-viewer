[package]
name = "prime-image-viewer"
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
log = "0.4"
# Pure-Rust image decoding (png / zune-jpeg / gif / bmp — no C, no rayon), so
# it cross-compiles to armv7a-unknown-xous-elf like hayro does in prime-pdf-viewer.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
# Scaled JPEG decode (image/zune-jpeg has no such API): lets an oversize JPEG
# be downsampled at IDCT time instead of refused outright. default-features
# MUST stay off -- its default `rayon` feature would break the pure-Rust
# device tree the same way a stray rand/getrandom bump would (see the
# workspace RANDOMNESS-AUDIT). Verify with `cargo tree -i rayon` after any
# version bump here.
jpeg-decoder = { version = "0.3", default-features = false, features = ["platform_independent"] }
# Streamed, downsampled PNG decode (image/png has no scaled-decode API of its
# own, but its `Reader::next_row()` streams one row at a time): lets an
# oversize PNG be box-filtered down at read time instead of refused outright.
# Already resolves transitively via `image`'s png feature, so this just pins
# a direct dependency at the same 0.18 line -- default-features MUST stay off
# for the same reason as jpeg-decoder above (see RANDOMNESS-AUDIT). Verify
# with `cargo tree -i rayon` after any version bump here.
png = { version = "0.18", default-features = false }
log-server = { package = "xous-api-log", path = "../keyos-sdk/lib/keyos/xous/api/log" }
server = { path = "../keyos-sdk/lib/keyos/server" }
slint-keyos-platform = { path = "../keyos-sdk/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = "../keyos-sdk/lib/keyos/sdk/crates/foundation-themes" }

[build-dependencies]
foundation-themes = { path = "../keyos-sdk/lib/keyos/sdk/crates/foundation-themes" }
slint-keyos-platform-build = { path = "../keyos-sdk/lib/keyos/slint-keyos-platform/build" }

# Vendored jpeg-decoder 0.3.2 with ONE patch (src/decoder.rs select_worker):
# never select the mpsc worker on KeyOS -- its UNBOUNDED channels queue every
# coefficient row when the single-core producer outruns the worker threads
# (~3 bytes/pixel: 108 MB for a 6000x6000 photo) and OOM the Prime's 128 MB
# pool with an uncatchable crash. Found 2026-08-19 via the img-6000.jpg
# calibration crash. Upstream image-rs/jpeg-decoder#290 was CLOSED
# won't-fix (crate is maintenance-mode; image-rs is moving to zune-jpeg),
# so this patch is PERMANENT. zune-jpeg is NOT a drop-in: it has no
# reduced-IDCT scaled decode (etemesi254/zune-image#434, open) -- the sole
# reason jpeg-decoder is vendored here. Keep it until #434 lands.
[patch.crates-io]
jpeg-decoder = { path = "vendor/jpeg-decoder" }
